name: E2E

on:
  workflow_dispatch: {}
  pull_request:
    paths-ignore:
      - 'solutions/**'
      - 'assets/**'
      - 'troubleshooting/**'
      - ".github/ISSUE_TEMPLATE/*"
      - 'README.md'
      - '*.md'
    branches:
      - main
      - release-*

# A new push to a PR cancels its previous run. Manual runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  USE_EXISTING_CLUSTER: false # set to true to use an existing kind cluster for debugging with act
  KUBERNETES_VERSION: 'v1.29.2'
  # Pinned so runner image updates can't change the cluster under the tests.
  KIND_VERSION: 'v0.33.0'
  KIND_SHA256: 'aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d'
  IMAGE_TAG: e2e

permissions:
  contents: read

jobs:
  # Compile everything and build the images once, so a compile error fails in minutes
  # and the e2e jobs below don't each rebuild the same five images.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space
        run: bash .github/scripts/free-disk-space.sh
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Compile
        run: |
          go build ./...
          go test -c ./test/e2e -o e2e.test
      - name: Build images
        run: make images-kind
      - name: Save images
        run: |
          docker save -o images.tar \
            "quay.io/open-cluster-management/registration-operator:${IMAGE_TAG}" \
            "quay.io/open-cluster-management/registration:${IMAGE_TAG}" \
            "quay.io/open-cluster-management/work:${IMAGE_TAG}" \
            "quay.io/open-cluster-management/placement:${IMAGE_TAG}" \
            "quay.io/open-cluster-management/addon-manager:${IMAGE_TAG}"
          ls -lh images.tar e2e.test
      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-build
          path: |
            images.tar
            e2e.test
          retention-days: 1

  e2e:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [default, hosted, singleton, grpc]
        # Shards run on separate kind clusters because specs share cluster-wide state.
        # "all" runs the whole suite; split by setting shards to [addon, core].
        shard: [addon, core]
        include:
          - mode: hosted
            make_env: KLUSTERLET_DEPLOY_MODE=SingletonHosted
          - mode: singleton
            make_env: KLUSTERLET_DEPLOY_MODE=Singleton
          - mode: grpc
            make_env: REGISTRATION_DRIVER=grpc
    name: e2e-${{ matrix.mode }}-${{ matrix.shard }}
    env:
      # The four slowest addon files (~15 of ~30 min); the core shard runs everything else.
      ADDON_SHARD_FILES: 'addonmanagement_test.go|addonmanagement_alpha_test.go|addon_lease_test.go|addon_lease_alpha_test.go'
    steps:
      - name: add permisson to docker.sock
        run: sudo chown runner:docker /var/run/docker.sock
        if: ${{ env.ACT }} # this step only runs locally when using the https://github.com/nektos/act to debug the e2e
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space
        run: bash .github/scripts/free-disk-space.sh
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install kind
        if: ${{ env.USE_EXISTING_CLUSTER != 'true' }}
        run: |
          curl -fsSLo kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  kind" | sha256sum -c -
          chmod +x kind && sudo mv kind /usr/local/bin/kind
          kind version
      - name: Setup kind
        if: ${{ env.USE_EXISTING_CLUSTER != 'true' }}
        run: kind create cluster --image kindest/node:${{ env.KUBERNETES_VERSION }} --wait 300s
      - name: Set KUBECONFIG
        run: |
          mkdir -p /home/runner/.kube
          kind get kubeconfig > /home/runner/.kube/config
        if: ${{ env.USE_EXISTING_CLUSTER == 'true' }}
      - name: Download build output
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: e2e-build
      - name: Load images into kind
        run: |
          kind load image-archive images.tar
          rm images.tar
          chmod +x e2e.test
      - name: Test E2E
        run: |
          case "${{ matrix.shard }}" in
            # Quoted because run-e2e pastes ARGS into a shell command and the regex contains '|'.
            addon) ARGS="--ginkgo.focus-file='${ADDON_SHARD_FILES}'" ;;
            core)  ARGS="--ginkgo.skip-file='${ADDON_SHARD_FILES}'" ;;
            *)     ARGS="" ;;
          esac
          make test-e2e SKIP_IMAGE_BUILD=true SKIP_E2E_BUILD=true ${{ matrix.make_env }} \
            ARGS="${ARGS} --ginkgo.junit-report=${GITHUB_WORKSPACE}/junit.xml"
        env:
          KUBECONFIG: /home/runner/.kube/config
      - name: Collect diagnostics
        if: ${{ failure() }}
        run: |
          mkdir -p diagnostics
          kind export logs diagnostics/kind || true
          for res in managedclusters managedclusteraddons clustermanagementaddons manifestworks \
              placements placementdecisions clustermanagers klusterlets csr; do
            kubectl get "$res" -A -o yaml > "diagnostics/${res}.yaml" 2>&1 || true
          done
          kubectl get pods -A -o wide > diagnostics/pods.txt 2>&1 || true
          kubectl get events -A --sort-by=.lastTimestamp > diagnostics/events.txt 2>&1 || true
        env:
          KUBECONFIG: /home/runner/.kube/config
      - name: Upload diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-${{ matrix.mode }}-${{ matrix.shard }}
          path: diagnostics
          retention-days: 7
      - name: Upload JUnit report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-${{ matrix.mode }}-${{ matrix.shard }}
          path: junit.xml
          if-no-files-found: ignore
          retention-days: 7
